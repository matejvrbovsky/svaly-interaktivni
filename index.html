<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Svaly lidského těla – interaktivní model</title>
<style>
:root{--ink:#1e293b;--mute:#64748b;--c:#94a3b8;--abd:0deg;--card:#fff;--soft:#f1f5f9;--bg:linear-gradient(135deg,#e0e7ff,#fce7f3 55%,#cffafe)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e2e8f0;--mute:#94a3b8;--card:#1e293b;--soft:#2b3a52;--bg:linear-gradient(135deg,#0f172a,#1e1b4b 55%,#0c2a3a)}}
:root[data-theme=dark]{--ink:#e2e8f0;--mute:#94a3b8;--card:#1e293b;--soft:#2b3a52;--bg:linear-gradient(135deg,#0f172a,#1e1b4b 55%,#0c2a3a)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg)}
header{max-width:1300px;margin:auto;padding:16px 24px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(20px,3vw,32px)}
.tabs{display:flex;gap:4px;padding:5px;background:var(--card);border-radius:999px;box-shadow:0 3px 12px #1e293b22}
.tabs button{border:0;background:none;padding:10px 24px;border-radius:999px;font:inherit;font-weight:700;color:var(--mute);cursor:pointer;touch-action:manipulation}
.tabs button[aria-selected=true]{color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899)}
main{max-width:1300px;margin:auto;padding:16px 24px 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:20px}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 32px #1e293b1c;padding:18px}
.hint{margin:0 0 4px;text-align:center;font-weight:700;color:var(--mute)}
.views{display:grid;grid-template-columns:minmax(0,1fr) clamp(88px,22%,170px);grid-template-rows:max-content max-content 1fr;gap:10px;align-items:start}
.vw{margin:0;min-width:0}
svg.view{display:block;width:100%;height:auto;touch-action:manipulation}
.vw.main{grid-column:1;grid-row:1/4}
.vw.main svg{max-height:70vh}
.vw.thumb{grid-column:2;cursor:pointer;padding:4px;border-radius:16px;background:var(--soft);transition:box-shadow .2s}
.vw.thumb:hover{box-shadow:0 0 0 3px #818cf8}
.vw.thumb .lbls{display:none}
.vw.thumb .m{pointer-events:none}
figcaption{text-align:center;font-weight:700;font-size:14px;color:var(--mute)}
.vw.main figcaption{display:none}
.nt *{transition:none!important}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:8px;font-size:14px;font-weight:600}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:6px;vertical-align:-2px}

/* ---- SVG parts ---- */
.skin{fill:#fbe3d3;stroke:#e6bda3;stroke-width:2}
.bone{fill:#fff9;stroke:#e6bda3;stroke-width:2;pointer-events:none}
.m{cursor:pointer;outline:none;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;fill-opacity:.85;
   transform-box:fill-box;transform-origin:50% 50%;
   transition:transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}
.m:not(.on):hover{filter:brightness(1.15);stroke-width:3}
.m:focus-visible{stroke:#1e293b;stroke-width:3.5}
body.sel .m:not(.on){fill-opacity:.3}
.m.on{fill-opacity:1;filter:saturate(1.5) drop-shadow(0 0 8px var(--c));transform:scale(var(--sx),var(--sy))}
.leg{transform:rotate(var(--abd));transform-origin:120px 56px;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.lbl{font:700 14px "Trebuchet MS",system-ui,sans-serif;fill:#334155;cursor:pointer}
.lbl:hover,.lbl.on{fill:#000;text-decoration:underline}

/* ---- info panel ---- */
#panel{align-self:start}
.ph{display:none;margin:0 0 8px;font-size:20px;font-weight:700;text-align:center}
.empty .ph{display:block}
.empty .det{display:none}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:14px;background:var(--c)}
h2{margin:8px 0 0;font-size:clamp(26px,3.4vw,36px);line-height:1.1}
.lat{margin:2px 0 10px;font-style:italic;color:var(--mute);font-size:18px}
#fn{font-size:18px;margin:0}
dl{margin:8px 0 0}
dt{margin-top:12px;font-weight:700;color:var(--mute)}
dd{margin:3px 0 0;padding:10px 14px;font-size:18px;background:var(--soft);border-radius:14px;border-left:6px solid var(--c)}
.note{margin:8px 0 0;font-size:13px;color:var(--mute)}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
.skin{fill:#fbe3d3;stroke:none;filter:drop-shadow(0 0 1.3px #b9825f)}
.dec{fill:#f0b99b;stroke:#fff;stroke-width:1.2;pointer-events:none}
.tend{fill:#f7e3d6;stroke:#e9c9b4;stroke-width:1;pointer-events:none}
.fib{pointer-events:none!important;filter:none!important;fill-opacity:1!important}
.lbl{font-style:italic}
.mt{margin:8px 0 0;font-weight:700;color:var(--c)}
#r0,#r1,#r2{transition:transform .8s cubic-bezier(.4,0,.2,1)}
#r0,#l0{transform-origin:118px 64px}#r1,#l1{transform-origin:118px 304px}#r2{transform-origin:126px 544px}
#l0,#l1{transition:transform .8s cubic-bezier(.4,0,.2,1)}
/* štítky přímo na svalech (bez čar) */
.ml{font:700 12.5px "Trebuchet MS",system-ui,sans-serif;fill:#1e293b;paint-order:stroke;stroke:#fff;stroke-width:3.4;stroke-linejoin:round;pointer-events:none}
.ml .s{font-weight:400;font-style:italic;font-size:10.5px}
.vw.thumb .ml{display:none}
@media(max-width:820px){
 header{padding:10px 12px 0}h1{font-size:18px}
 .tabs button{padding:8px 14px}
 main{grid-template-columns:1fr;padding:8px 10px 14px;gap:10px}
 .card{padding:10px;border-radius:18px}
 .hint{font-size:13px;margin:0 0 4px}
 .views{grid-template-columns:minmax(0,1fr) 80px;gap:8px}
 .vw.main{grid-row:1/4}
 .vw.main svg{max-height:54vh}
 .vw.thumb{padding:3px}
 figcaption{font-size:12px}
 .legend{font-size:12px;gap:4px 10px;margin-top:6px}
 .ph{font-size:16px}h2{font-size:24px}#fn,dd{font-size:16px}.note{display:none}
}

.scenes{display:grid}.scenes>div{grid-area:1/1;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,visibility 0s .5s}
.ovm #ovw,.sct #trunk,body:not(.ovm):not(.sct) #legs{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s}
.js2,.je2,.jh,.jk,.ja{transition:transform .8s cubic-bezier(.4,0,.2,1)}
.js2{transform-origin:146px 108px;transform:translateY(var(--ty,0px)) rotate(var(--sa,0deg))}.je2{transform-origin:144px 214px;transform:rotate(var(--ea,-15deg))}
.jh{transform-origin:140px 300px;transform:rotate(var(--hp,0deg))}.jk{transform-origin:142px 440px;transform:rotate(var(--kn,15deg))}.ja{transform-origin:140px 585px;transform:rotate(var(--an,0deg)) scaleX(var(--fsx,1))}
.ov{max-height:70vh}
.sk{fill:url(#skg)}.so{fill:none;stroke:#e6bda3;stroke-width:1.5}.ar{fill:url(#skg);stroke:#e6bda3;stroke-width:1.5}
.jsh,.jel{transition:transform .8s cubic-bezier(.4,0,.2,1)}
.jsh{transform-origin:108px 114px;transform:translateY(var(--ty,0px)) rotate(var(--sh,0deg)) scaleY(var(--fa,1))}
.jel{transform-origin:98px 226px;transform:rotate(var(--el,-4deg)) scaleY(var(--fe,1))}
.sub{margin:0 auto 8px;width:max-content;max-width:100%}.sub button{padding:6px 16px;font-size:14px}
header .tabs{overflow-x:auto;max-width:100%}
.back{display:block;margin:0 auto 6px;border:0;border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899);cursor:pointer}.back[hidden]{display:none}
.rn{margin:8px 0 0;text-align:center;font-size:14px;font-weight:600;color:var(--mute)}.rn:empty{display:none}

.zk{cursor:pointer}.zk rect{fill:var(--card);stroke:var(--mute);stroke-width:1}.zk text{font:700 11px "Trebuchet MS",system-ui,sans-serif;fill:var(--ink);pointer-events:none}
.vw.thumb .zc{display:none}
@media(max-width:820px){header .tabs button{padding:8px 11px;font-size:14px}}
.fh,.fk{transition:transform .8s cubic-bezier(.4,0,.2,1)}.fh{transform-origin:128px 322px;transform:rotate(var(--ab,0deg)) scaleY(var(--fh,1))}.fk{transform-origin:128px 458px;transform:scaleY(var(--fk,1))}
.det{opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}body.zr-trunk .det.t,body.zr-arms .det.a{opacity:1;visibility:visible;transition:opacity .6s .5s,visibility 0s}

.jt{transform-origin:150px 322px;transition:transform .8s cubic-bezier(.4,0,.2,1)}#tF .jt,#tB .jt{transform:rotate(var(--tl,0deg)) scaleY(var(--tz,1))}#tS .jt{transform:rotate(var(--tr,0deg))}
.ot,.ots{transform-origin:150px 322px;transition:transform .8s cubic-bezier(.4,0,.2,1)}.ot{transform:scaleX(var(--rx,1)) scaleY(var(--tz,1))}.ot.oh{transform:scaleY(var(--tz,1))}.ots{transform:rotate(var(--tr,0deg))}
.ov{aspect-ratio:300/640}
.dl,.dt,.da,.dh{opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s,transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}
.s-leg .dl,.s-trunk .dt,.s-arm .da,.s-head .dh{opacity:1;visibility:visible;transition:opacity .6s .4s,visibility 0s,transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}
.bq{transition:opacity .5s,visibility 0s .5s,transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}.s-leg .bq,.s-arm .ba{opacity:0;visibility:hidden}.ba{transition:opacity .5s,visibility 0s .5s,transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}
.half .fh,.half .jsh{transition:opacity .6s,transform .8s cubic-bezier(.4,0,.2,1)}
.s-leg #ovF .cl .fh,.s-leg #ovS .cl .fh,.s-leg #ovB .half:not(.cl) .fh,.s-arm #ovF .cl .jsh,.s-arm #ovB .half:not(.cl) .jsh{opacity:0;pointer-events:none}
.jw,.jws{transition:transform .8s cubic-bezier(.4,0,.2,1)}.jw{transform-origin:91px 325px;transform:scaleX(var(--hx,.7)) scaleY(var(--wy,1))}.jws{transform-origin:142px 322px;transform:rotate(var(--wr,0deg))}
.cap{margin:10px 6px 0;text-align:center;font-size:15px;line-height:1.35}.cap:empty{display:none}.cap b{display:block;font-size:18px;color:var(--c)}.cap i{color:var(--mute)}
.fx{fill:none;stroke:#8a5a44;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.fe{fill:#5b3a2e}.hf{pointer-events:none;transform:translateY(var(--hn,0px));transition:transform .8s cubic-bezier(.4,0,.2,1)}
.fbr{transform:translateY(var(--bw,0px));transition:transform .8s cubic-bezier(.4,0,.2,1)}.fey{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(var(--ey,1));transition:transform .8s cubic-bezier(.4,0,.2,1)}
.fmo{transform-box:fill-box;transform-origin:100% 50%;transform:translateY(var(--jw,0px)) scale(var(--mx,1),var(--my,1));transition:transform .8s cubic-bezier(.4,0,.2,1)}
.hhs{transform-origin:152px 92px;transform:rotate(var(--hs,0deg));transition:transform .8s cubic-bezier(.4,0,.2,1)}
.dp{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s,transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}
.deep .dp{opacity:1;visibility:visible;transition:opacity .5s .1s,visibility 0s,transform .8s cubic-bezier(.34,1.3,.5,1),fill-opacity .4s,filter .4s}
.deep .m:not(.dp){opacity:.12;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:0 0 8px}.row .sub{margin:0}
.deepbtn{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;color:var(--mute);background:var(--card);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}.deepbtn[aria-pressed=true]{color:#fff;background:linear-gradient(135deg,#b45309,#ef4444)}
.thumb,.thumbs{fill:#d9a183;stroke:#c08468}.thumb{transform:translateX(var(--th,0px));transition:transform .8s cubic-bezier(.4,0,.2,1)}.thumbs{transform:translateX(var(--ths,0px));opacity:var(--tho,1);transition:opacity .8s,transform .8s cubic-bezier(.4,0,.2,1)}
.bly{transform-origin:112px 240px;transform:scaleX(var(--bx,1));transition:transform .8s cubic-bezier(.4,0,.2,1)}
.pm{opacity:var(--pmo,0);transition:opacity .8s}.kn{opacity:var(--kno,0);transition:opacity .8s}.kn circle{fill:#8a5a44}#ovB .pm{opacity:var(--kno,0)}#ovB .kn{opacity:var(--pmo,0)}
.rt{opacity:var(--rto,0);transform:scaleX(var(--rtf,1));transition:opacity .6s,transform .8s;pointer-events:none}.rta{stroke:var(--c);stroke-width:1.8}
.js2{transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .5s}.rtw .rta{stroke-width:3}.rtw{opacity:var(--rtt,0);transition:opacity .6s;pointer-events:none}
.ra{pointer-events:none;transition:opacity .6s,transform .8s}.ra path{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round}
.raS{opacity:var(--rS,0);transform:scaleX(var(--rSf,1))}.raH{opacity:var(--rH,0);transform:scaleX(var(--rHf,1))}.raN{opacity:var(--rN,0);transform:scaleX(var(--rNf,1))}.raK{opacity:var(--rK,0);transform:scaleX(var(--rKf,1))}
.ft{transform-origin:128px 604px;transform:rotate(var(--fr,0deg));transition:transform .8s cubic-bezier(.4,0,.2,1)}
#ovS .hf,#ovS .nose{transform:translateX(var(--hxn,0px)) translateY(var(--hn,0px));opacity:var(--hxo,1);transition:transform .8s,opacity .6s}
body{overflow-x:hidden}

/* ---- popisky s úsečkami (sloupce po stranách) ---- */
.vw.main{position:relative}
.vw.main svg.ov{max-width:66%;margin-inline:auto}
.mlab{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.vw.thumb .mlab{display:none}
.ml2{cursor:pointer;transition:opacity .3s}.ml2.off{opacity:0}
.ml2 line{stroke:var(--mute);stroke-width:1;opacity:.8;pointer-events:none}
.ml2 circle{fill:var(--ink);stroke:var(--card);stroke-width:1;pointer-events:none}
.ml2 text{fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;font-family:"Trebuchet MS",system-ui,sans-serif;pointer-events:all}
.ml2.off text{pointer-events:none}
.ml2 .cz{font-weight:700}.ml2 .sl{font-style:italic;font-weight:400;fill:var(--mute)}
.ml2.on line{stroke:var(--c);stroke-width:2;opacity:1}.ml2.on .cz{fill:var(--c)}
</style>
</head>
<body class="ovm">
<header>
  <h1>Svaly lidského těla</h1>
  <div class="tabs" role="tablist"><button role="tab" data-r="body">Celé tělo</button><button role="tab" data-r="head">Hlava a krk</button><button role="tab" data-r="trunk">Trup</button><button role="tab" data-r="arms">Paže</button><button role="tab" data-r="legs">Nohy</button></div>
</header>

<main>
  <section class="card stage">
    <div class="row"><div class="tabs sub" role="tablist"><button role="tab" data-v="front">Zepředu</button><button role="tab" data-v="back">Zezadu</button><button role="tab" data-v="side">Z boku</button></div><button class="deepbtn" id="deep" aria-pressed="false">Hluboké svaly</button></div><p class="hint" id="hint"></p><button class="back" id="bk" hidden>← Celá noha</button>

/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let view='front', cur=null;

$$('.half').forEach(h=>{const c=h.cloneNode(true);c.setAttribute('transform','translate(300 0) scale(-1 1)');c.classList.add('cl');h.after(c)});
/* ===== setup: gradients, legend, muscle styling ===== */
$('#gr').insertAdjacentHTML('beforeend',Object.entries(G).map(([k,[,c]])=>
  `<linearGradient id="g-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,${c} 55%,#fff)"/><stop offset="1" style="stop-color:${c}"/></linearGradient>`).join(''));
$('#legend').innerHTML=Object.values(G).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('');
$$('path[data-m]').forEach(e=>{
  const m=M[e.dataset.m],g=G[m.g];
  e.classList.add('m');
  e.style.fill=`url(#g-${m.g})`;
  e.style.setProperty('--c',g[1]);
  e.style.setProperty('--sx',g[2]||1.22);   /* contraction: wider … */
  e.style.setProperty('--sy',g[3]||.86);    /* … and shorter */
  e.setAttribute('tabindex',0); e.setAttribute('role','button'); e.setAttribute('aria-label',m.n);
});

/* textura svalových vláken: průhledná kopie každého svalu se vzorem */
$$('path.m').forEach(e=>{const c=e.cloneNode();c.classList.add('fib');['tabindex','role','aria-label'].forEach(t=>c.removeAttribute(t));c.style.fill='url(#fib)';e.after(c)});

/* ===== select a muscle (or null = back to rest) ===== */
function pick(k){
  cur=k; const m=M[k];
  $$('[data-m]').forEach(e=>e.classList.toggle('on',e.dataset.m===k));
  document.body.classList.toggle('sel',!!m);
  const q={...REST,...(m?m.p:{})};                     // target pose
  const ft=q.a-.6*(q.h+q.k);                           // chodidlo částečně sleduje bérec
  $$('#r0,#l0').forEach(e=>e.style.transform=`rotate(${q.h}deg)`);   // kyčel
  $$('#r1,#l1').forEach(e=>e.style.transform=`rotate(${q.k}deg)`);   // koleno
  $$('#r2').forEach(e=>e.style.transform=`rotate(${ft}deg)`);        // kotník
  document.documentElement.style.setProperty('--abd',q.abd+'deg'); // leg swing in Front/Back view
  const po=(m&&m.po)||{},rs=document.documentElement.style;rs.setProperty('--sh',(po.sh||0)+'deg');rs.setProperty('--el',(po.el===undefined?-4:po.el)+'deg');
